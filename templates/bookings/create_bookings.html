<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Request Security | SecureHub</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #f5f7fb;
        font-family: Arial, sans-serif;
      }

      .booking-card {
        border: none;
        border-radius: 16px;
        overflow: hidden;
      }

      .booking-header {
        background-color: #0d6efd;
        color: white;
        padding: 30px;
      }

      .booking-header h2 {
        font-weight: 700;
        margin-bottom: 8px;
      }

      .booking-body {
        padding: 30px;
      }

      .form-label {
        font-weight: 600;
      }

      .form-control,
      .form-select {
        padding: 11px 12px;
        border-radius: 8px;
      }

      .submit-btn {
        font-weight: 600;
        padding: 11px 22px;
      }
    </style>
  </head>

  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-7">
          <div class="card booking-card shadow">
            <div class="booking-header">
              <h2>Request Security</h2>

              <p class="mb-0">Submit your security requirements.</p>
            </div>

            <div class="booking-body">
              <form method="POST">
                {% csrf_token %}

                <!-- Security Service -->

                <div class="mb-4">
                  <label
                    for="{{ form.service.id_for_label }}"
                    class="form-label"
                  >
                    Security Service
                  </label>

                  {{ form.service }}
                </div>

                <!-- Event Date -->

                <div class="mb-4">
                  <label
                    for="{{ form.event_date.id_for_label }}"
                    class="form-label"
                  >
                    Event Date
                  </label>

                  {{ form.event_date }}
                </div>

                <!-- Event Time -->

                <div class="mb-4">
                  <label
                    for="{{ form.event_time.id_for_label }}"
                    class="form-label"
                  >
                    Event Time
                  </label>

                  {{ form.event_time }}
                </div>

                <!-- Location -->

                <div class="mb-4">
                  <label
                    for="{{ form.location.id_for_label }}"
                    class="form-label"
                  >
                    Event Location
                  </label>

                  {{ form.location }}
                </div>

                <!-- Number of Guards -->

                <div class="mb-4">
                  <label
                    for="{{ form.number_of_guards.id_for_label }}"
                    class="form-label"
                  >
                    Number of Security Guards
                  </label>

                  {{ form.number_of_guards }}
                </div>

                <!-- Additional Information -->

                <div class="mb-4">
                  <label
                    for="{{ form.message.id_for_label }}"
                    class="form-label"
                  >
                    Additional Information
                  </label>

                  {{ form.message }}
                </div>

                <!-- Buttons -->

                <div class="d-flex justify-content-between">
                  <a
                    href="{% url 'services:service_list' %}"
                    class="btn btn-secondary"
                  >
                    Cancel
                  </a>

                  <button type="submit" class="btn btn-primary submit-btn">
                    Submit Booking Request
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
